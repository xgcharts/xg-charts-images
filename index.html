<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XG Charts — Chart Images Generator</title>

<style>
:root {
  --bg: #101a2b;
  --panel: #17263e;
  --field: #1c304c;
  --line: #354e6d;
  --muted: #a7b9d2;
  --blue: #277FF2;
  --navy: #223A59;
  --sky: #88C1F2;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: #f4f8ff;
  font: 15px system-ui, -apple-system, Arial, sans-serif;
}

header {
  padding: 20px 24px;
  background: #202f46;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

h1 {
  margin: 0;
  font-size: 23px;
}

header small {
  color: var(--muted);
  line-height: 1.6;
}

main {
  max-width: 1550px;
  margin: auto;
  padding: 24px;
  display: grid;
  grid-template-columns: minmax(290px, 390px) minmax(0, 1fr);
  gap: 22px;
}

.panel {
  min-width: 0;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 22px;
}

h2 {
  margin: 0 0 17px;
  font-size: 18px;
}

label {
  display: block;
  margin: 16px 0 7px;
  color: #c6d8f0;
  font-weight: 650;
  font-size: 13px;
}

select {
  width: 100%;
  background: var(--field);
  color: white;
  border: 1px solid #456181;
  border-radius: 9px;
  padding: 12px;
  font: inherit;
}

button {
  background: var(--blue);
  color: white;
  border: 0;
  border-radius: 9px;
  padding: 12px 17px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

button:hover {
  filter: brightness(1.1);
}

button.secondary {
  background: #304b6e;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 20px;
}

.status {
  padding: 13px;
  background: #203652;
  color: #c6d8f0;
  border-radius: 9px;
  font-size: 13px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.fine {
  font-size: 12px;
  line-height: 1.7;
  color: var(--muted);
}

.previewBox {
  width: 100%;
  background: #f2f2f2;
  border-radius: 10px;
  overflow: hidden;
}

#preview {
  width: 100%;
  height: auto;
  max-height: 78vh;
  object-fit: contain;
  display: block;
}

#count {
  color: #9fc6ff;
  font-size: 13px;
  margin-top: 12px;
}

@media(max-width: 850px) {
  main {
    grid-template-columns: 1fr;
    padding: 12px;
  }

  .panel {
    padding: 16px;
  }

  header {
    padding: 18px;
  }
}
</style>
</head>

<body>

<header>
  <div>
    <h1>XG CHARTS · Chart Images Generator</h1>
    <small>
      Kworb Charts · Kworb Worldwide · YouTube Trending · Direct PNG download
    </small>
  </div>

  <button id="refresh" class="secondary">
    ↻ Refresh Sheets
  </button>
</header>

<main>

  <section class="panel">

    <h2>1. Choose your ranking</h2>

    <div id="status" class="status">
      Loading Google Sheets…
    </div>

    <label for="source">Source</label>

    <select id="source">
      <option value="kworb">Kworb Charts — Countries</option>
      <option value="worldwide">Kworb Worldwide — 8 charts</option>
      <option value="youtube">YouTube Trending — Regions</option>
    </select>

    <label for="title">Song / Album / Video</label>
    <select id="title"></select>

    <label for="chart">Chart</label>
    <select id="chart"></select>

    <label for="format">Image size</label>

    <select id="format">
      <option value="xwide">
        X · Horizontal (1600 × 900)
      </option>

      <option value="auto">
        Auto · Height adapts (1200px wide)
      </option>

      <option value="xportrait">
        X · Portrait (1200 × 1500)
      </option>

      <option value="square">
        Instagram · Square (1080 × 1080)
      </option>

      <option value="igportrait">
        Instagram · Portrait (1080 × 1350)
      </option>

      <option value="story">
        Stories (1080 × 1920)
      </option>
    </select>

    <label for="perpage">Rows per image</label>

    <select id="perpage">
      <option value="all" selected>
        All positions (auto pagination)
      </option>

      <option value="5">5</option>
      <option value="10">10</option>
      <option value="15">15</option>
      <option value="20">20</option>
    </select>

    <label for="page">Image page</label>
    <select id="page"></select>

    <div class="actions">
      <button id="download">
        ↓ Download PNG
      </button>

      <button id="downloadAll" class="secondary">
        Download all pages
      </button>
    </div>

    <p class="fine">
      Images download directly to your device.
      No Google Slides, no Drive files and no changes to your bots.
    </p>

  </section>

  <section class="panel">

    <h2>2. Image preview</h2>

    <div class="previewBox">
      <canvas id="preview" width="1600" height="900"></canvas>
    </div>

    <div id="count"></div>

  </section>

</main>

<script>
'use strict';

/* =========================================================
   GOOGLE SHEETS
========================================================= */

const SPREADSHEET_ID =
  '1CgnuCSeJ__iJRP4uYuom3TUAoH3G6zuXyrEfp9p9GIY';

const SHEETS = {
  kworb: 'KworbCharts',
  worldwide: 'KworbWorldwide',
  youtube: 'YouTubeTrendingVideos'
};

const $ = id => document.getElementById(id);

const DB = {};
const ERRORS = {};

let groups = [];
let current = null;
let pages = [];

/* =========================================================
   UTILITIES
========================================================= */

function str(value) {
  return String(value ?? '').trim();
}

function normalize(value) {
  return str(value)
    .toLowerCase()
    .replace(/[^a-z0-9]/g, '');
}

function value(row, ...names) {
  for (const name of names) {
    const result = row[normalize(name)];

    if (
      result !== undefined &&
      result !== null &&
      result !== ''
    ) {
      return result;
    }
  }

  return '';
}

function numericRank(value) {
  const n = Number(
    str(value).replace(/[#,]/g, '')
  );

  return Number.isFinite(n) && n > 0 ? n : 0;
}

function changeText(value) {
  const raw = str(value);

  if (!raw) return '—';

  // Preserve the value from Google Sheets.
  // Examples: NE, NEW, +2, -7, 0.

  if (/^[+-]\d+$/.test(raw)) {
    return raw;
  }

  if (/^\d+$/.test(raw)) {
    return raw === '0' ? '0' : '+' + raw;
  }

  return raw;
}

function dateKey(value) {
  const s = str(value);

  let m = s.match(
    /^(\d{4})-(\d{1,2})-(\d{1,2})/
  );

  if (m) {
    return (
      m[1] + '-' +
      m[2].padStart(2, '0') + '-' +
      m[3].padStart(2, '0')
    );
  }

  m = s.match(
    /^Date\((\d+),(\d+),(\d+)/
  );

  if (m) {
    return (
      m[1] + '-' +
      String(Number(m[2]) + 1).padStart(2, '0') + '-' +
      String(m[3]).padStart(2, '0')
    );
  }

  return '';
}

function latestDate(rows) {
  return rows
    .map(row => dateKey(value(row, 'Date')))
    .filter(Boolean)
    .sort()
    .pop() || '';
}

function timeKey(value) {
  const m = str(value).match(
    /(\d{1,2}):(\d{2})(?::(\d{2}))?/
  );

  if (!m) return 0;

  return (
    Number(m[1]) * 3600 +
    Number(m[2]) * 60 +
    Number(m[3] || 0)
  );
}

/* =========================================================
   GOOGLE SHEETS READER
========================================================= */

function parseGVIZ(body) {
  const start = body.indexOf('{');
  const end = body.lastIndexOf('}');

  if (start < 0 || end < start) {
    throw new Error('Invalid Google Sheets response');
  }

  const json = JSON.parse(
    body.slice(start, end + 1)
  );

  if (json.status === 'error') {
    throw new Error(
      json.errors?.map(e => e.message).join(', ') ||
      'Google Sheets error'
    );
  }

  const table = json.table || {};

  return [
    (table.cols || []).map(
      col => col.label || col.id || ''
    ),

    ...(table.rows || []).map(row =>
      (row.c || []).map(
        cell => cell?.f ?? cell?.v ?? null
      )
    )
  ];
}

function toObjects(matrix) {
  const headerIndex = matrix.findIndex(
    row => row.some(
      cell => cell !== null && cell !== ''
    )
  );

  if (headerIndex < 0) return [];

  const keys = matrix[headerIndex].map(normalize);

  return matrix
    .slice(headerIndex + 1)
    .filter(row =>
      row.some(
        cell => cell !== null && cell !== ''
      )
    )
    .map(row => {
      const obj = {};

      keys.forEach((key, index) => {
        if (key) {
          obj[key] = row[index] ?? null;
        }
      });

      return obj;
    });
}

async function loadSheets() {
  $('status').textContent =
    'Loading Google Sheets…';

  await Promise.all(
    Object.entries(SHEETS).map(
      async ([key, sheetName]) => {

        try {
          const url =
            'https://docs.google.com/spreadsheets/d/' +
            SPREADSHEET_ID +
            '/gviz/tq?tqx=out:json&headers=1&sheet=' +
            encodeURIComponent(sheetName) +
            '&_=' + Date.now();

          const response = await fetch(
            url,
            { cache: 'no-store' }
          );

          if (!response.ok) {
            throw new Error(
              'HTTP ' + response.status
            );
          }

          const body = await response.text();

          DB[key] = toObjects(
            parseGVIZ(body)
          );

          delete ERRORS[key];

        } catch (error) {
          DB[key] = [];
          ERRORS[key] = error.message;
        }
      }
    )
  );

  $('status').textContent =
    Object.entries(SHEETS)
      .map(([key, name]) => {
        const count = DB[key]?.length || 0;

        return (
          name + ': ' + count + ' records' +
          (ERRORS[key]
            ? ' · ERROR: ' + ERRORS[key]
            : '')
        );
      })
      .join(' | ');

  rebuild();
}

/* =========================================================
   BUILD GROUPS
========================================================= */

function makeGroups() {
  const source = $('source').value;

  const all = DB[source] || [];

  if (!all.length) return [];

  const map = new Map();

  const date = latestDate(all) || 'Current';

  for (const [index, row] of all.entries()) {

    let title = '';
    let chart = '';
    let platform = '';
    let region = '';
    let position = 0;
    let change = '—';
    let groupKey = '';
    let rowKey = '';

    if (source === 'kworb') {

      title = str(
        value(row, 'Title')
      );

      platform = str(
        value(row, 'Platform')
      );

      chart = str(
        value(row, 'Chart Name')
      );

      region = str(
        value(
          row,
          'Region',
          'Country',
          'Country / Region'
        )
      );

      position = numericRank(
        value(
          row,
          'Current Rank',
          'Rank',
          'Position'
        )
      );

      change = changeText(
        value(row, 'Change')
      );

      if (
        !title ||
        !platform ||
        !chart ||
        !region ||
        !position
      ) {
        continue;
      }

      groupKey = [
        title,
        platform,
        chart
      ].join('\u001f');

      rowKey = region;

    } else if (source === 'worldwide') {

      title = str(
        value(row, 'Title')
      );

      platform = str(
        value(row, 'Platform')
      );

      chart = str(
        value(row, 'Chart Name', 'Chart')
      );

      region = str(
        value(row, 'Region')
      );

      position = numericRank(
        value(
          row,
          'Current Rank',
          'Rank',
          'Position'
        )
      );

      change = changeText(
        value(row, 'Change')
      );

      if (
        !title ||
        !chart ||
        !position
      ) {
        continue;
      }

      groupKey = [
        title,
        str(value(row, 'Type'))
      ].join('\u001f');

      rowKey = [
        platform,
        region,
        chart
      ].join('\u001f');

    } else if (source === 'youtube') {

      title = str(
        value(
          row,
          'Video Title',
          'Title',
          'Video Name'
        )
      );

      platform = 'YouTube';

      chart = str(
        value(
          row,
          'Chart',
          'Chart Name',
          'Type'
        )
      );

      region = str(
        value(
          row,
          'Country / Region',
          'Region',
          'Country'
        )
      );

      position = numericRank(
        value(
          row,
          'Current Rank',
          'Rank',
          'Position'
        )
      );

      change = changeText(
        value(row, 'Change')
      );

      if (
        !title ||
        !chart ||
        !region ||
        !position
      ) {
        continue;
      }

      groupKey = [
        str(value(row, 'Video ID')) || title,
        chart
      ].join('\u001f');

      rowKey = region;
    }

    if (!map.has(groupKey)) {

      const subtitle =
        source === 'kworb'
          ? platform + ' · ' + chart
          : source === 'youtube'
            ? 'YouTube Trending · ' + chart
            : 'Worldwide & European Charts';

      map.set(groupKey, {
        source,
        title,
        chart,
        platform,
        subtitle,
        date,
        entries: new Map()
      });
    }

    const group = map.get(groupKey);

    const cells =
      source === 'worldwide'
        ? [
            [
              platform,
              chart,
              region
            ].filter(Boolean).join(' · '),

            '#' + position,

            change
          ]
        : [
            '#' + position,
            region,
            change
          ];

    const previous = group.entries.get(rowKey);

    const currentTime = timeKey(
      value(row, 'Time')
    );

    if (
      !previous ||
      currentTime >= previous.time
    ) {
      group.entries.set(rowKey, {
        cells,
        position,
        time: currentTime,
        index
      });
    }
  }

  return [...map.values()]
    .map(group => {

      const entries = [...group.entries.values()];

      entries.sort((a, b) => {
        if (group.source === 'worldwide') {
          return (
            a.cells[0].localeCompare(b.cells[0]) ||
            a.position - b.position
          );
        }

        return (
          a.position - b.position ||
          a.cells[1].localeCompare(b.cells[1])
        );
      });

      return {
        ...group,
        rows: entries.map(entry => entry.cells)
      };
    })
    .sort((a, b) =>
      a.title.localeCompare(b.title) ||
      a.subtitle.localeCompare(b.subtitle)
    );
}

/* =========================================================
   SELECTORS
========================================================= */

function setOptions(id, options, selected = '') {
  const select = $(id);

  select.replaceChildren();

  for (const optionValue of options) {
    const option = document.createElement('option');

    option.value = optionValue;
    option.textContent = optionValue;

    select.appendChild(option);
  }

  if (options.includes(selected)) {
    select.value = selected;
  }
}

function rebuild() {
  const oldTitle = $('title').value;

  groups = makeGroups();

  const titles = [
    ...new Set(
      groups.map(group => group.title)
    )
  ];

  setOptions(
    'title',
    titles,
    oldTitle
  );

  selectTitle();
}

function selectTitle() {
  const oldChart = $('chart').value;

  const available = groups.filter(
    group => group.title === $('title').value
  );

  const charts = [
    ...new Set(
      available.map(group => group.subtitle)
    )
  ];

  setOptions(
    'chart',
    charts,
    oldChart
  );

  selectChart();
}

function selectChart() {
  current = groups.find(
    group =>
      group.title === $('title').value &&
      group.subtitle === $('chart').value
  ) || null;

  updatePages();
}

/* =========================================================
   IMAGE FORMATS
========================================================= */

function formatInfo() {
  const formats = {
    xwide: [1600, 900],
    auto: [1200, 0],
    xportrait: [1200, 1500],
    square: [1080, 1080],
    igportrait: [1080, 1350],
    story: [1080, 1920]
  };

  return formats[$('format').value];
}

function updatePages() {
  pages = [];

  if (current && current.rows.length) {

    const [width, fixedHeight] = formatInfo();

    const scale = width / 1200;

    const top = Math.round(235 * scale);
    const rowHeight = Math.round(47 * scale);
    const footer = Math.round(85 * scale);

    const maximumHeight =
      fixedHeight || Math.round(2500 * scale);

    const availableHeight =
      maximumHeight - top - footer - rowHeight;

    const safeRows = Math.max(
      1,
      Math.floor(
        availableHeight / rowHeight
      )
    );

    const requested =
      $('perpage').value === 'all'
        ? 99999
        : Number($('perpage').value);

    const pageSize = Math.max(
      1,
      Math.min(safeRows, requested)
    );

    for (
      let i = 0;
      i < current.rows.length;
      i += pageSize
    ) {
      pages.push(
        current.rows.slice(i, i + pageSize)
      );
    }
  }

  setOptions(
    'page',
    pages.map(
      (_, index) =>
        `Image ${index + 1} / ${pages.length}`
    )
  );

  $('download').disabled = !pages.length;
  $('downloadAll').disabled = !pages.length;

  render();
}

/* =========================================================
   CANVAS UTILITIES
========================================================= */

function fittedFont(
  context,
  content,
  maxWidth,
  initialSize,
  minimumSize
) {
  let size = initialSize;

  while (size > minimumSize) {
    context.font = `${size}px Arial`;

    if (
      context.measureText(content).width <= maxWidth
    ) {
      break;
    }

    size -= 2;
  }

  return size;
}

function drawImage(pageIndex) {
  if (!current || !pages.length) return null;

  const rows = pages[pageIndex] || pages[0];

  const [width, fixedHeight] = formatInfo();

  const scale = width / 1200;

  const S = number =>
    Math.round(number * scale);

  const tableTop = S(235);
  const rowHeight = S(47);
  const footerHeight = S(85);

  const height =
    fixedHeight ||
    Math.max(
      S(675),
      tableTop +
      rowHeight * (rows.length + 1) +
      footerHeight
    );

  const canvas = $('preview');

  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext('2d');

  /* Background */

  ctx.fillStyle = '#F2F2F2';
  ctx.fillRect(0, 0, width, height);

  /* Brand */

  ctx.fillStyle = '#277FF2';
  ctx.fillRect(
    S(42),
    S(28),
    S(7),
    S(38)
  );

  ctx.fillStyle = '#223A59';
  ctx.font = `bold ${S(29)}px Arial`;

  ctx.fillText(
    'XG CHARTS',
    S(68),
    S(59)
  );

  /* Title */

  const title = 'XG — ' + current.title;

  const titleFont = fittedFont(
    ctx,
    title,
    width - S(85),
    S(43),
    S(20)
  );

  ctx.font = `bold ${titleFont}px Arial`;

  ctx.fillText(
    title,
    S(42),
    S(132)
  );

  /* Subtitle */

  const subtitle =
    current.subtitle +
    ' · ' +
    current.date +
    (
      pages.length > 1
        ? ` · ${pageIndex + 1}/${pages.length}`
        : ''
    );

  const subtitleFont = fittedFont(
    ctx,
    subtitle,
    width - S(85),
    S(23),
    S(13)
  );

  ctx.font = `${subtitleFont}px Arial`;
  ctx.fillStyle = '#536A86';

  ctx.fillText(
    subtitle,
    S(42),
    S(178)
  );

  /* Table header */

  ctx.fillStyle = '#E4EFFD';

  ctx.fillRect(
    S(40),
    tableTop,
    width - S(80),
    rowHeight
  );

  const worldwide =
    current.source === 'worldwide';

  const columns = worldwide
    ? ['CHART', 'RANK', 'CHANGE']
    : ['RANK', 'COUNTRY / REGION', 'CHANGE'];

  const columnX = worldwide
    ? [S(54), S(890), S(1050)]
    : [S(54), S(260), S(990)];

  ctx.fillStyle = '#223A59';
  ctx.font = `bold ${S(19)}px Arial`;

  columns.forEach((heading, index) => {
    ctx.fillText(
      heading,
      columnX[index],
      tableTop + S(31)
    );
  });

  /* Rows */

  rows.forEach((row, rowIndex) => {

    const y =
      tableTop +
      rowHeight * (rowIndex + 1);

    ctx.fillStyle =
      rowIndex % 2 === 0
        ? '#FFFFFF'
        : '#F2F2F2';

    ctx.fillRect(
      S(40),
      y,
      width - S(80),
      rowHeight
    );

    row.forEach((cell, cellIndex) => {

      const content = str(cell);

      const maxWidth = worldwide
        ? (
            cellIndex === 0
              ? S(810)
              : S(125)
          )
        : (
            cellIndex === 0
              ? S(180)
              : cellIndex === 1
                ? S(700)
                : S(145)
          );

      const fontSize = fittedFont(
        ctx,
        content,
        maxWidth,
        S(25),
        S(14)
      );

      ctx.font =
        `${cellIndex === 0 ? 'bold ' : ''}` +
        `${fontSize}px Arial`;

      if (cellIndex === 2) {

        if (content.startsWith('+')) {
          ctx.fillStyle = '#087F68';

        } else if (content.startsWith('-')) {
          ctx.fillStyle = '#C24755';

        } else if (
          content.toUpperCase() === 'NE' ||
          content.toUpperCase() === 'NEW'
        ) {
          ctx.fillStyle = '#277FF2';

        } else {
          ctx.fillStyle = '#223A59';
        }

      } else if (content.startsWith('#')) {

        ctx.fillStyle = '#087F68';

      } else {

        ctx.fillStyle = '#223A59';
      }

      ctx.fillText(
        content,
        columnX[cellIndex],
        y + S(32)
      );
    });
  });

  /* Footer */

  ctx.fillStyle = '#CFDDEC';

  ctx.fillRect(
    S(40),
    height - S(62),
    width - S(80),
    S(2)
  );

  ctx.fillStyle = '#277FF2';

  ctx.font = `bold ${S(23)}px Arial`;

  ctx.fillText(
    'xgcharts.com',
    S(42),
    height - S(23)
  );

  return canvas;
}

/* =========================================================
   PREVIEW
========================================================= */

function render() {
  if (!current || !pages.length) {

    $('count').textContent =
      'No current ranking positions available for this source.';

    const canvas = $('preview');
    const ctx = canvas.getContext('2d');

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    return;
  }

  const pageIndex = Math.max(
    0,
    $('page').selectedIndex
  );

  drawImage(pageIndex);

  $('count').textContent =
    current.rows.length +
    ' positions · ' +
    pages.length +
    ' image(s) · ' +
    current.date;
}

/* =========================================================
   DOWNLOAD PNG
========================================================= */

function fileName(index) {
  const raw =
    'XG-Charts-' +
    current.source + '-' +
    current.title + '-' +
    current.subtitle + '-' +
    current.date + '-' +
    (index + 1) +
    '-of-' +
    pages.length +
    '.png';

  return raw
    .normalize('NFKD')
    .replace(/[^a-zA-Z0-9._-]+/g, '-')
    .slice(0, 170);
}

async function downloadPNG(index) {
  const canvas = drawImage(index);

  if (!canvas) return;

  const blob = await new Promise(resolve =>
    canvas.toBlob(
      resolve,
      'image/png'
    )
  );

  if (!blob) {
    throw new Error(
      'Could not generate PNG'
    );
  }

  const url = URL.createObjectURL(blob);

  const link = document.createElement('a');

  link.href = url;
  link.download = fileName(index);

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(
    () => URL.revokeObjectURL(url),
    15000
  );
}

/* =========================================================
   EVENTS
========================================================= */

$('refresh').addEventListener(
  'click',
  loadSheets
);

$('source').addEventListener(
  'change',
  rebuild
);

$('title').addEventListener(
  'change',
  selectTitle
);

$('chart').addEventListener(
  'change',
  selectChart
);

$('format').addEventListener(
  'change',
  updatePages
);

$('perpage').addEventListener(
  'change',
  updatePages
);

$('page').addEventListener(
  'change',
  render
);

$('download').addEventListener(
  'click',
  () => {
    const index = Math.max(
      0,
      $('page').selectedIndex
    );

    downloadPNG(index);
  }
);

$('downloadAll').addEventListener(
  'click',
  async () => {
    for (
      let i = 0;
      i < pages.length;
      i++
    ) {
      await downloadPNG(i);

      await new Promise(
        resolve => setTimeout(resolve, 400)
      );
    }

    render();
  }
);

/* =========================================================
   INITIAL LOAD
========================================================= */

loadSheets();

</script>

</body>
</html>
